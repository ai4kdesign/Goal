name: One-Time Keystore Generator

on:
  workflow_dispatch: # Allows manual run with a button click

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Release Keystore
        run: |
          # 1. Generate the private keystore
          keytool -genkeypair -v \
            -keystore release-signing.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias app_release_key \
            -dname "CN=Goal Release,O=Goal,C=US" \
            -storepass "GoalSecurePass2026!" \
            -keypass "GoalSecurePass2026!"

          # 2. Output the base64 string directly to the log
          echo "==================== COPY BELOW THIS LINE ===================="
          base64 -w 0 release-signing.jks
          echo ""
          echo "==================== COPY ABOVE THIS LINE ===================="

          # 3. Shred the file immediately so it leaves no trace on disk
          rm -f release-signing.jks
