name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # verified SHA
        with:
          gradle-version: '8.7'

      - name: Require Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. Run the 'Generate Signing Key (one-time)' workflow first."
            exit 1
          fi

      - name: Compute Monotonic Version Number
        run: |
          VER_CODE=$((100 + ${{ github.run_number }}))
          echo "VER_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "VER_NAME=1.0.$VER_CODE" >> $GITHUB_ENV
          echo "RELEASE_TAG=v1.0.$VER_CODE" >> $GITHUB_ENV
          touch app/proguard-rules.pro

      - name: Build Unsigned Release APK
        run: |
          gradle assembleRelease \
            -PversionCode=${{ env.VER_CODE }} \
            -PversionName=${{ env.VER_NAME }}

      - name: Decode Secret Keystore and Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          ALIGNED_APK="app/build/outputs/apk/release/app-release.apk"

          if [ "$UNSIGNED_APK" != "$ALIGNED_APK" ]; then
            "$ZIPALIGN" -p -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          fi

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --print-certs "$ALIGNED_APK"

          sha256sum "$ALIGNED_APK" | awk '{print $1}' > "${ALIGNED_APK}.sha256"

      - name: Shred Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release and Upload Signed APK + Checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ env.RELEASE_TAG }}" --cleanup-tag --yes || true
          gh release create "${{ env.RELEASE_TAG }}" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release.apk.sha256 \
            --title "NHLStreams ${{ env.RELEASE_TAG }}" \
            --notes "Automated hardened release build ${{ env.RELEASE_TAG }}" \
            --latest
