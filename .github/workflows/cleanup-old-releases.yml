name: Clean Up Old Releases and Runs (one-time)

# Deletes EVERY release, EVERY tag, and EVERY other workflow run in this repo.
# Run it once, then delete this file so the button isn't left lying around.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE-ALL to delete every release, tag and old workflow run."
        required: true

permissions:
  contents: write   # delete releases and tags
  actions: write    # delete workflow runs

jobs:
  cleanup:
    if: ${{ inputs.confirm == 'DELETE-ALL' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Delete all releases
        run: |
          gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName' > releases.txt
          echo "Found $(wc -l < releases.txt) releases"
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes \
              && echo "Deleted release $tag" || echo "Could not delete release $tag"
          done < releases.txt

      - name: Delete leftover tags
        run: |
          gh api "repos/$REPO/git/matching-refs/tags" --paginate --jq '.[].ref' > tags.txt || true
          echo "Found $(wc -l < tags.txt) leftover tags"
          while read -r ref; do
            [ -z "$ref" ] && continue
            gh api -X DELETE "repos/$REPO/git/$ref" \
              && echo "Deleted $ref" || echo "Could not delete $ref"
          done < tags.txt

      - name: Delete all other workflow runs
        run: |
          # Collect every run ID first, then delete, so pagination doesn't skip any.
          gh api "repos/$REPO/actions/runs?per_page=100" --paginate --jq '.workflow_runs[].id' > runs.txt
          echo "Found $(wc -l < runs.txt) workflow runs"
          while read -r id; do
            [ -z "$id" ] && continue
            [ "$id" = "$GITHUB_RUN_ID" ] && continue   # can't delete the run that's doing the deleting
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null \
              && echo "Deleted run $id" || echo "Could not delete run $id (it may still be running)"
          done < runs.txt
